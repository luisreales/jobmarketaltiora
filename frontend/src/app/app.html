<div class="app-shell">
	<button
		(click)="toggleSidebar()"
		aria-label="Toggle navigation"
		class="mobile-menu-button"
		type="button">
		Menu
	</button>

	<aside [class.is-open]="isSidebarOpen" class="sidebar">
		<div class="brand">Altiora</div>

		<nav class="nav-links" aria-label="Main navigation">
			@for (section of navSections; track $index) {
				@if (section.label) {
					<div class="nav-section">
						<button
							class="nav-section-header"
							(click)="toggleSection(section.label!)"
							[attr.aria-expanded]="openSections.has(section.label!)">
							<span class="nav-section-label">{{ section.label }}</span>
							<svg
								class="chevron"
								[class.is-open]="openSections.has(section.label!)"
								xmlns="http://www.w3.org/2000/svg"
								viewBox="0 0 16 16"
								fill="currentColor">
								<path fill-rule="evenodd" d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/>
							</svg>
						</button>
						<div class="nav-section-body" [class.is-open]="openSections.has(section.label!)">
							<div class="nav-section-inner">
								@for (item of section.items; track item.path) {
									<a
										(click)="closeSidebar()"
										[routerLink]="item.path"
										routerLinkActive="is-active"
										class="nav-link">
										{{ item.label }}
									</a>
								}
							</div>
						</div>
					</div>
				} @else {
					@for (item of section.items; track item.path) {
						<a
							(click)="closeSidebar()"
							[routerLink]="item.path"
							routerLinkActive="is-active"
							class="nav-link">
							{{ item.label }}
						</a>
					}
					<div class="nav-divider"></div>
				}
			}
		</nav>
	</aside>

	<div
		(click)="closeSidebar()"
		[class.is-visible]="isSidebarOpen"
		aria-hidden="true"
		class="sidebar-backdrop">
	</div>

	<main class="content">
		<router-outlet></router-outlet>
	</main>
</div>
